services:
  media-access-api:
    build:
      context: .
      dockerfile: src/MediaAccess.Api/Dockerfile
    ports:
      - "5136:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"

      # Storage settings
      Storage__BaseUrl: "${STORAGE_BASE_URL}"
      Storage__InternalAccess: "${INTERNAL_AUTH_API_KEY}"
    env_file:
      - .env
